<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#ff78ad">
  <title>美樂蒂的隨機英文花園</title>
  <style>
    :root{--berry:#9c285e;--pink:#ff6fa8;--soft:#fff0f6;--cream:#fffaf2;--ink:#513345;--line:#f2bfd3;--good:#21845f;--bad:#d4436f;--shadow:0 16px 40px #9c285e20}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 6%,#ffd1e1 0 9%,transparent 27%),radial-gradient(circle at 93% 4%,#ffe8a8 0 8%,transparent 25%),linear-gradient(145deg,#fffaf3,#fff0f7);padding:clamp(10px,2.5vw,22px);padding-bottom:calc(24px + env(safe-area-inset-bottom))}button{font:inherit;color:inherit}.app{max-width:1080px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-weight:1000;font-size:clamp(20px,4vw,29px);display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:50% 50% 44% 44%;background:var(--pink);color:white;box-shadow:0 5px 0 var(--berry);font-size:25px}.score{background:white;border:2px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:900;white-space:nowrap}.card{background:#fffdf9ef;border:2px solid white;border-radius:28px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.intro{padding:clamp(25px,4vw,40px);display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:13px;font-weight:1000;letter-spacing:.12em;color:var(--berry);margin:0 0 8px}.intro h1{font-size:clamp(32px,5vw,52px);line-height:1.08;margin:0 0 14px}.intro p{font-size:16px;line-height:1.75;color:#7d6371;margin:0 0 22px}.primary,.sound,.answer,.level,.reward-btn{border:0;cursor:pointer;transition:.15s}.primary{align-self:flex-start;padding:15px 24px;border-radius:17px;background:var(--berry);color:white;font-weight:1000;box-shadow:0 6px 0 #681b3f}.primary:active,.sound:active,.answer:active,.reward-btn:active{transform:translateY(4px);box-shadow:none}.character-card{text-align:center;padding:17px;background:linear-gradient(160deg,#ffe4ef,#fff8d9)}.character-card h2{margin:0;font-size:21px}.mood{margin:5px 0;color:#8b6376;font-size:14px}.stage{height:300px;display:grid;place-items:center;position:relative;overflow:hidden}.stage:after{content:"";position:absolute;bottom:18px;width:190px;height:24px;border-radius:50%;background:#a44c7330}.stage img{z-index:1;width:260px;height:295px;object-fit:contain;filter:drop-shadow(0 12px 9px #7f36563b)}.collection{font-weight:900;color:var(--berry);font-size:14px}.map-head{display:flex;justify-content:space-between;align-items:end;margin:25px 4px 10px}.map-head h2{margin:0;font-size:23px}.map-head span{font-size:14px;color:#8b7280}.levels{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}.level{min-height:68px;padding:7px 2px;background:white;border:2px solid var(--line);border-radius:16px;color:#a28593;font-weight:900}.level b{display:block;font-size:21px}.level.current{background:#ffe2ee;border-color:var(--pink);color:var(--berry);box-shadow:0 4px 0 var(--pink)}.level.done{background:#fff4c7;border-color:#efc958;color:#8a6716}.level:disabled{cursor:not-allowed;opacity:.72}.game{margin-top:19px;padding:clamp(20px,3vw,30px);display:grid;grid-template-columns:.82fr 1.18fr;gap:26px}.prompt{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.tag{background:#ffe2ee;color:var(--berry);border-radius:999px;padding:7px 13px;font-weight:900;font-size:14px}.sound{margin:17px 0 10px;width:118px;height:118px;border-radius:50%;border:5px solid white;background:linear-gradient(145deg,var(--pink),#f4b84e);color:white;font-size:48px;box-shadow:0 8px 0 var(--berry),0 12px 27px #d84f8a35}.sound.playing{animation:pulse .6s infinite alternate}.instruction{font-size:19px;font-weight:1000;margin:4px}.progress{font-size:14px;color:#8a6d7b;margin:5px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:center}.answer{min-height:108px;background:white;border:3px solid var(--line);border-radius:22px;font-size:clamp(31px,5vw,48px);font-weight:1000;box-shadow:0 6px 0 #e2aac1}.answer small{display:block;font-size:16px;color:#927181}.answer:hover{background:#fff4f8;border-color:#ef8db5}.answer.correct{background:#dcf7eb;border-color:#54b68f;box-shadow:0 6px 0 #2c8c69}.answer.wrong{background:#ffe2eb;border-color:#e97798;animation:shake .25s}.feedback{grid-column:1/-1;min-height:38px;text-align:center;font-size:18px;font-weight:1000}.good{color:var(--good)}.bad{color:var(--bad)}.reward{display:none;margin-top:19px;padding:28px;text-align:center;background:linear-gradient(145deg,#fff2b9,#ffe5ef)}.reward.show{display:block}.gift{font-size:68px;animation:bounce .7s}.reward h2{margin:5px 0}.reward p{color:#7e6472}.reward-btn{padding:12px 18px;background:white;border:2px solid var(--line);border-radius:14px;font-weight:900}.garden{margin-top:19px;padding:24px}.garden-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.garden h2{margin:0}.reset{border:0;background:transparent;color:#9a7b8a;text-decoration:underline;cursor:pointer}.prizes{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;margin-top:16px}.prize{min-height:82px;border-radius:17px;background:#f8f1f4;border:2px dashed #dbc8d1;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:900;color:#a58d98;padding:6px}.prize span{font-size:31px;filter:grayscale(1);opacity:.3}.prize.open{background:#fff8d6;border-style:solid;border-color:#ebc94c;color:#7a5d16}.prize.open span{filter:none;opacity:1}.tip{text-align:center;color:#927987;font-size:13px;margin:16px 0 0}@keyframes pulse{to{transform:scale(1.07)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes bounce{50%{transform:translateY(-12px)}}@media(max-width:760px){body{padding:10px}.hero,.game{grid-template-columns:1fr}.intro{padding:24px}.stage{height:260px}.stage img{height:260px}.levels{grid-template-columns:repeat(5,1fr)}.game{gap:13px}.answers{gap:8px}.answer{min-height:88px}.prizes{grid-template-columns:repeat(5,1fr)}.topbar{align-items:flex-start}.score{font-size:13px}}@media(max-width:390px){.brand{font-size:18px}.logo{width:43px;height:43px}.score{padding:8px 10px}.answer{font-size:31px;padding:7px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><span class="logo">🌸</span>美樂蒂的隨機英文花園</div><div class="score">⭐ <span id="stars">0</span> 顆星星</div></header>
  <section class="hero">
    <article class="card intro"><p class="eyebrow">LISTEN・THINK・CHOOSE</p><h1>聽單字，<br>找出第一個字母！</h1><p>每次都會隨機抽出新的英文單字。按喇叭可以重複聽，選出單字開頭的大小寫字母；每關答對 3 題就過關。</p><button class="primary" id="startBtn">開始第 1 關</button></article>
    <article class="card character-card"><h2>美樂蒂陪你一起學</h2><p class="mood" id="mood">仔細聽，你一定找得到！</p><div class="stage"><img src="melody-character.png" alt="穿著粉紅洋裝的美樂蒂"></div><div class="collection" id="collection">花園還在等你收集禮物</div></article>
  </section>
  <div class="map-head"><h2>十關隨機挑戰</h2><span>每關隨機 3 個單字</span></div>
  <nav class="levels" id="levels" aria-label="關卡選單"></nav>
  <section class="card game" id="game"><div class="prompt"><span class="tag" id="levelTag">第 1 關・花苞小徑</span><button class="sound" id="soundBtn" aria-label="重播英文單字">🔊</button><p class="instruction">按喇叭聽單字</p><p class="progress" id="progress">再選出開頭字母</p></div><div class="answers" id="answers"><div class="feedback">準備好就按「開始第 1 關」吧！</div></div></section>
  <section class="card reward" id="reward"><div class="gift" id="gift">🌷</div><h2 id="rewardTitle">得到花園禮物！</h2><p id="rewardText"></p><button class="reward-btn" id="nextBtn">前往下一關</button></section>
  <section class="card garden"><div class="garden-head"><h2>🌼 美樂蒂的花園收藏</h2><button class="reset" id="resetBtn">重新開始</button></div><div class="prizes" id="prizes"></div><p class="tip">進度會自動保存在這台裝置中；重新開啟遊戲也能繼續。</p></section>
</main>
<script>
const words=[
['apple','A'],['ant','A'],['airplane','A'],['ball','B'],['banana','B'],['bear','B'],['cat','C'],['cake','C'],['car','C'],['dog','D'],['duck','D'],['door','D'],['egg','E'],['elephant','E'],['elbow','E'],['fish','F'],['flower','F'],['frog','F'],['grape','G'],['goat','G'],['gift','G'],['hat','H'],['horse','H'],['house','H'],['ice cream','I'],['igloo','I'],['insect','I'],['juice','J'],['jelly','J'],['jacket','J'],['kite','K'],['key','K'],['king','K'],['lion','L'],['lemon','L'],['leaf','L'],['moon','M'],['milk','M'],['mouse','M'],['nose','N'],['nest','N'],['nurse','N'],['orange','O'],['owl','O'],['ocean','O'],['pig','P'],['pizza','P'],['pencil','P'],['queen','Q'],['quilt','Q'],['quiz','Q'],['rabbit','R'],['rainbow','R'],['robot','R'],['star','S'],['sun','S'],['snake','S'],['tiger','T'],['table','T'],['train','T'],['umbrella','U'],['uncle','U'],['up','U'],['violin','V'],['van','V'],['vegetable','V'],['water','W'],['wolf','W'],['window','W'],['xylophone','X'],['x-ray','X'],['box','X'],['yo-yo','Y'],['yellow','Y'],['yogurt','Y'],['zebra','Z'],['zoo','Z'],['zero','Z']
];
const levelNames=['花苞小徑','草莓野餐','彩虹溪谷','小兔森林','甜點小屋','蝴蝶花園','雲朵城堡','星星舞台','月亮湖畔','英文花冠'];
const rewards=[['🌷','粉紅鬱金香'],['🍓','香甜草莓'],['🌈','彩虹拱門'],['🐰','小兔朋友'],['🧁','草莓蛋糕'],['🦋','粉紅蝴蝶'],['☁️','微笑雲朵'],['⭐','閃亮星星'],['🌙','晚安月亮'],['👑','英文花冠']];
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),KEY='melodyRandomWordGameV1';
let state=JSON.parse(localStorage.getItem(KEY)||'{"unlocked":0,"stars":0}'),currentLevel=Math.min(state.unlocked,9),round=0,current=null,locked=false,bag=[],recent=[];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function refillBag(){bag=shuffle(words.map((_,i)=>i))}
function nextRandomWord(){if(!bag.length)refillBag();let pos=bag.findIndex(i=>!recent.includes(words[i][0]));if(pos<0)pos=0;const idx=bag.splice(pos,1)[0];recent.push(words[idx][0]);if(recent.length>8)recent.shift();return words[idx]}
function makeChoices(correct){const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(x=>x!==correct);const picks=shuffle(letters).slice(0,2);return shuffle([correct,...picks])}
function speak(word){if(!('speechSynthesis' in window)){$('progress').textContent='這個瀏覽器不支援語音播放';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.78;u.pitch=1;u.volume=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;$('soundBtn').classList.add('playing');u.onend=u.onerror=()=>$('soundBtn').classList.remove('playing');speechSynthesis.speak(u)}
function renderLevels(){$('stars').textContent=state.stars;$('levels').innerHTML=levelNames.map((name,i)=>`<button class="level ${i<state.unlocked?'done':''} ${i===currentLevel?'current':''}" data-i="${i}" ${i>state.unlocked?'disabled':''}><b>${i<state.unlocked?'✓':i===currentLevel?'🌸':'🔒'}</b>${i+1} 關</button>`).join('');document.querySelectorAll('.level:not(:disabled)').forEach(b=>b.onclick=()=>start(+b.dataset.i))}
function renderPrizes(){$('prizes').innerHTML=rewards.map((r,i)=>`<div class="prize ${i<state.unlocked?'open':''}"><div><span>${i<state.unlocked?r[0]:'🔒'}</span><br>${i<state.unlocked?r[1]:'神秘禮物'}</div></div>`).join('');$('collection').textContent=state.unlocked?`已收集 ${state.unlocked} / 10 份花園禮物`:'花園還在等你收集禮物'}
function start(i=currentLevel){currentLevel=Math.min(i,9);round=0;locked=false;$('reward').classList.remove('show');$('startBtn').textContent=`重新挑戰第 ${currentLevel+1} 關`;$('levelTag').textContent=`第 ${currentLevel+1} 關・${levelNames[currentLevel]}`;renderLevels();newQuestion();$('game').scrollIntoView({behavior:'smooth',block:'center'})}
function newQuestion(){locked=false;current=nextRandomWord();const choices=makeChoices(current[1]);$('progress').textContent=`第 ${round+1} / 3 題・仔細聽，選出開頭字母`;$('answers').innerHTML=choices.map(x=>`<button class="answer" data-v="${x}">${x}<small>${x.toLowerCase()}</small></button>`).join('')+'<div class="feedback" id="feedback"></div>';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b));setTimeout(()=>speak(current[0]),250)}
function answer(btn){if(locked)return;if(btn.dataset.v===current[1]){locked=true;btn.classList.add('correct');state.stars++;save();$('stars').textContent=state.stars;$('feedback').textContent=`答對了！${current[0]} 是 ${current[1]}${current[1].toLowerCase()} 開頭`;$('feedback').className='feedback good';round++;if(round>=3)setTimeout(win,750);else setTimeout(newQuestion,900)}else{btn.classList.add('wrong');$('feedback').textContent='再聽一次，慢慢找就好！';$('feedback').className='feedback bad';setTimeout(()=>btn.classList.remove('wrong'),450);speak(current[0])}}
function win(){const idx=currentLevel,r=rewards[idx],isNew=idx>=state.unlocked;if(isNew){state.unlocked=idx+1;save()}renderLevels();renderPrizes();$('gift').textContent=r[0];$('rewardTitle').textContent=`第 ${idx+1} 關完成！`;$('rewardText').textContent=isNew?`獲得「${r[1]}」，已放進美樂蒂的花園！`:`「${r[1]}」已經收藏在花園裡囉！`;$('nextBtn').textContent=idx===9?'再玩一次第 10 關':'前往下一關';$('reward').classList.add('show');$('answers').innerHTML='<div class="feedback good">🎉 太棒了，連續完成 3 個隨機單字！</div>';$('mood').textContent=idx===9?'十關完成，你是英文小高手！':'新的花園禮物開花了！';$('reward').scrollIntoView({behavior:'smooth',block:'center'})}
$('soundBtn').onclick=()=>current&&speak(current[0]);$('startBtn').onclick=()=>start(currentLevel);$('nextBtn').onclick=()=>start(Math.min(currentLevel+1,9));$('resetBtn').onclick=()=>{if(confirm('要清除所有關卡、星星和禮物，重新開始嗎？')){state={unlocked:0,stars:0};currentLevel=0;recent=[];bag=[];save();renderLevels();renderPrizes();$('mood').textContent='仔細聽，你一定找得到！';$('startBtn').textContent='開始第 1 關';$('answers').innerHTML='<div class="feedback">準備好就按「開始第 1 關」吧！</div>';$('reward').classList.remove('show')}};
renderLevels();renderPrizes();
</script>
</body>
</html>
